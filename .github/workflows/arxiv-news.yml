name: Daily arXiv News

on:
  schedule:
    - cron: '0 8 * * *' # UTC 08:00 = 北京时间 16:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arxiv-news
  cancel-in-progress: false

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Test update failure and rerun handling
        run: python3 scripts/test_arxiv_news.py
      - name: Fetch arXiv papers
        run: python3 scripts/fetch-arxiv-news.py --days 7 --dedup-window 14
      - name: Validate data
        run: python3 scripts/lint-data.py
      - name: Stage new files and updated success records
        id: check
        run: |
          git add data/news/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "arXiv 动态更新 $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
      # GITHUB_TOKEN pushes do not trigger push workflows. deploy.yml explicitly
      # listens for this workflow's successful completion and checks out main.
