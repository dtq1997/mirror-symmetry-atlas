- slug: dubrovin-frobenius-1994
  date: '1994-07-04'
  precision: day
  title:
    en: Dubrovin posts Geometry of 2d topological field theories
    zh: Dubrovin 公开 Frobenius 流形讲义预印本
  description: 《Geometry of 2d topological field theories》系统讨论 WDVV、Frobenius 流形、等单值变形与可积层级。Dubrovin 的 1992
    年论文第 637 页已给出 Frobenius 流形定义，因此这份讲义的上传时间不是该概念的首次提出时间。
