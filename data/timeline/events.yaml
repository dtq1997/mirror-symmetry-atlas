- slug: kontsevich-hms-1994
  date: '1994'
  precision: year
  title:
    en: Kontsevich proposes Homological Mirror Symmetry at ICM
    zh: Kontsevich 在 ICM 提出同调镜像对称猜想
  description: 苏黎世 ICM 报告《Homological Algebra of Mirror Symmetry》提出用同调代数表述镜像对称。报告第 18 页讨论 $c_1(V)=0$ 的辛流形及其镜像代数流形，联系
    Fukaya 范畴所构造的导出范畴与凝聚层导出范畴；原文同时保留适当扩大范畴等构造限定。
  people:
  - kontsevich
  concepts:
  - homological-mirror-symmetry
  - mirror-symmetry
  papers:
  - alg-geom/9411018
  era: modern
  importance: milestone
  date_note: 按报告所记的 ICM 1994 会议年份；arXiv v1 于 1994 年 11 月 30 日提交。
  sources:
  - label: Kontsevich 原报告：arXiv 记录及第 18 页 Homological Mirror Conjecture
    url: https://arxiv.org/abs/alg-geom/9411018v1
    last_verified: '2026-10-08'
  reviewed_on: '2026-10-08'
  review_note: 核对报告身份、年份和第 18 页原始猜想措辞。此条记载历史提议；具体空间上今天的证明进展另见开放问题页。
