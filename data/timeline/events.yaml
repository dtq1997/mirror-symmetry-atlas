- slug: xu-quantum-groups-2017
  date: '2017-12-30'
  precision: day
  title:
    en: Xiaomeng Xu submits Frobenius manifolds and quantum groups
    zh: 徐晓濛提交 Frobenius 流形与量子群预印本
  description: 《Frobenius manifolds and quantum groups》的 v1 摘要介绍关于量子 Stokes 矩阵的等单值 KZ 联络，并讨论其半经典极限与半单 Frobenius
    流形的 Dubrovin 联络。v1 中关于 Givental 圈空间变换量子化的表述仍是猜想。
  people:
  - xu-xiaomeng
  concepts:
