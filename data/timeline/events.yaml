- slug: cotti-coalescence-2019
  date: '2019'
  precision: year
  title:
    en: Cotti–Dubrovin–Guzzetti publish on coalescing eigenvalues
    zh: Cotti–Dubrovin–Guzzetti 的特征值合并论文出版
  description: 《Isomonodromy Deformations at an Irregular Singularity with Coalescing Eigenvalues》刊于 Duke Mathematical
    Journal 168(6)，967–1108。论文研究 Poincaré 秩为 1、首项矩阵在合并处仍可对角化的系统；在另有 $z=0$ 处的 Fuchs 奇点及相应留数消失条件下，讨论等单值变形跨越合并轨迹的延拓。
  people:
