events:
- slug: witten-2dtft-1990
  date: 1990-04
  precision: month
  title:
    en: Witten lectures on intersection numbers and KdV
    zh: Witten 在哈佛讲述交叉数与 KdV 的猜想
  description: Witten 在哈佛的几何与拓扑会议讲座中讨论稳定曲线模空间的交叉理论与 KdV 层级的联系。相关讲义《Two-dimensional gravity and intersection
    theory on moduli space》的摘要明确记载了这两次讲座。
  people: []
  concepts:
  - gromov-witten-theory
  - integrable-hierarchy
  papers: []
  era: modern
  importance: milestone
  date_note: 按讲义摘要所记的 1990 年 4 月讲座日期。PDF 卷首印为 1991 年，出版平台的卷号/DOI 标记为 1990；此处不以平台年份替代讲座日期。
  sources:
  - label: Witten 讲义：第一页摘要、卷首及收稿日期
    url: https://archive.intlpress.com/site/pub/files/_fulltext/journals/sdg/1990/0001/0001/SDG-1990-0001-0001-a005.pdf
    last_verified: '2026-10-08'
