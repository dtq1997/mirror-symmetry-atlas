- slug: kontsevich-witten-1992
  date: 1992-06
  precision: month
  title:
    en: Kontsevich’s proof of Witten’s conjecture is published
    zh: Kontsevich 的 Witten 猜想证明论文出版
  description: 《Intersection theory on the moduli space of curves and the matrix Airy function》通过矩阵积分研究曲线模空间的交叉数，证明
    Witten 猜想。论文刊于 Communications in Mathematical Physics 147，1–23。
  people:
  - kontsevich
  concepts:
  - gromov-witten-theory
  - integrable-hierarchy
  papers: []
  era: modern
  importance: milestone
  date_note: 期刊页面记载 1992 年 6 月出版；MPIM 已保存 MPI/91-77 预印本，因此不把 1992 年写成工作首次公开之年。
  sources:
