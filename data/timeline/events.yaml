- slug: wdvv-equations-1990
  date: '1990'
  precision: year
  title:
    en: Early literature on WDVV associativity equations
    zh: WDVV 结合律方程的早期文献（1990—1991）
  description: WDVV 的名称来自 Witten、Dijkgraaf、Erik Verlinde 和 Herman Verlinde。Dubrovin 的 1992 年论文将两种主场时的结合律方程追溯到
    Witten，将相关条件追溯到 Dijkgraaf 与两位 Verlinde 的工作。
  people: []
  concepts:
  - wdvv-equations
  - topological-field-theory
  papers: []
  era: modern
  importance: milestone
  date_note: 以这组 1990—1991 年文献的起点排序；不认定唯一的“发现年”。
  sources:
  - label: Dubrovin（1992）：第 629、635—636 页及参考文献 [2]、[10]
    url: https://people.sissa.it/~dubrovin/Papers/1992/dubrovin_1992_npb.pdf
    last_verified: '2026-10-08'
  reviewed_on: '2026-10-08'
