- slug: cecotti-vafa-tt-star-1993
  date: '1993'
  precision: year
  title:
    en: Cecotti–Vafa publish On Classification of N=2 Supersymmetric Theories
    zh: Cecotti–Vafa 的 N=2 理论分类论文出版
  description: 这篇论文把二维 $N=2$ 理论的孤子谱与共形点手征场的标度维数联系起来，并讨论分类方案。它是继 1991 年《Topological—anti-topological fusion》之后的工作；不能把
    1993 年当作 $tt^*$ 几何的起始年份。
