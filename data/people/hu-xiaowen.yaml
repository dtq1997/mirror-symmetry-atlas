personal_notes: |
  **与张庆生同门：** 两人都是周坚的学生（张庆生 2015-2020），且 2022-2024 年前后都进入大湾区大学，
  是本项目中的重要同门连接。
  "Mirror symmetry for quadric hypersurfaces" 通过二次超曲面的 Landau-Ginzburg 镜像模型和 Picard-Fuchs 方程建立 Frobenius 流形层面的镜像对称同构。
  与柯华忠合作的 "Gamma conjecture II for quadrics" 把其与中山 Gamma conjecture 圈连接起来。
  近期有向代数 K 理论（Witt 向量上 smooth schemes）的方向扩展。
  2026 HUST 会议参会者。研究方向与本项目核心（Frobenius 流形、镜像对称）高度重合，
  是重要的桥接节点。
