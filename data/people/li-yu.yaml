personal_notes: |
  多伦多大学数学系博士后（2022-），合作导师 Joel Kamnitzer 与 Eckhard Meinrenken。
  研究方向：辛几何与几何表示论，特别关注 flag variety 上的 Poisson 几何、量子
  Boson 代数、cluster 结构与可积系统、nilpotent 轨道的紧化。

  学术轨迹：2014 港大数学本科 → 芝加哥大学博士 2021（导师 Victor Ginzburg，论文
  "Quantum Boson Algebra and Poisson Geometry of the Flag Variety"，MGP 277097）
  → MPIM Bonn 博后 2021-2022 → 多伦多博后 2022-至今。

  代表性工作线：
  (1) 与 Sam Evens (Notre Dame) 合作系列：Lagrangian 子代数的 abelian ideal
      分类 (2020)，semisimple Lie algebra 中 Cartan 子代数的 wonderful
      compactification (2024)；
  (2) 与 Jiang-Hua Lu、Yanpeng Li 合作：从 Poisson 簇的 cluster 结构构造多项式
      可积系统 (arXiv:2411.18904)，把 Bott-Samelson 坐标变成 T-Poisson seed；
  (3) 与 Kamnitzer、Ilin、Przytycki、Rybnikov 合作：cactus flower 曲线模空间
      与 virtual cactus 群 (2023)；
  (4) 与 Boming Jia 合作：sl(n+1) 中 minimal nilpotent 轨道在 n⁺⊕n⁻ 上限制
      与 toric 簇的关系 (2025)。

  2023-05-24 应北理工唐修棣 (Xiudi Tang) 邀请到良乡校区作报告，题目正是
  arXiv:2411.18904 这条工作线（"Integrable systems on the dual of nilpotent
  Lie subalgebras and T-Poisson cluster structures"），当时还是 in progress。

  与本图谱潜在连接：通过 Yanpeng Li 与日内瓦 Alekseev 学派 (Alekseev、xu-xiaomeng)
  存在二阶合作链；导师 Meinrenken 与 Alekseev 长期合作（Weil 代数量子化、
  group-valued moment map）。
