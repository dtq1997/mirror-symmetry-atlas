personal_notes: |
  20岁获博士学位 (Oxford 1971, Hirzebruch 指导)。MPIM Bonn Director 1995-2019。
  学生包括 Kontsevich (Fields 1998) 和 Viazovska (Fields 2022)。
  与杨迪合作的 KdV tau-function 工作把数论方法引入可积系统。
  代表作: "On tau-functions for the KdV hierarchy" (with Dubrovin, Yang)
