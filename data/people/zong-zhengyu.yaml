personal_notes: |
  与方博汉(7篇)密切合作，核心方向是 remodeling conjecture 和 toric CY 的 GW 理论。
  代表作：Open WDVV equations and Frobenius structures for toric CY 3-folds (2023)。
  2026 HUST 会议报告: All genus Crepant Transformation Conjecture for toric CY 3-orbifolds。
  与方博汉、Chiu-Chu Melissa Liu 合作完成 BKMP Remodeling Conjecture 的 toric CY3 orbifold 全亏格证明，是其身份和研究圈的重要锚点。
