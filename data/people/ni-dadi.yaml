personal_notes: '河南大学数学与统计学院讲师，2023年7月起任职。2014年9月至2018年7月在河南大学读数学与应用数学本科，2018年9月至2023年6月在清华大学读数学博士。


  研究方向为微分几何、非线性李理论。已列论文涉及 Lie pairs、dg manifolds、Atiyah 类、广义复几何和 hyper-Lie Poisson 流形等。与陈酌、程家豪等有合作论文；合著关系本身不足以确定博士导师或同门关系。博士导师待核实。

