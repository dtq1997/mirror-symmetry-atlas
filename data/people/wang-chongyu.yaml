personal_notes: |
  北京大学数学科学学院博士研究生，导师刘小博。
  与导师合作两篇 arXiv 论文：
  (1) 2024 年 Buryak-Shadrin 重言关系猜想 (tautological relation on moduli spaces of curves)，
  (2) 2026 年 Complexity of quantum cohomology (2D TQFT 的电路复杂度)。
  是刘小博在 GW theory / 量子上同调方向的现任博士生，研究主线接续王新、杨成浪等师兄的工作
  (tautological relations on $\overline{\mathcal{M}}_{g,n}$)。
  公开邮箱在两篇论文 TeX 源中出现过 wwccyy@pku.edu.cn 与 wangcyu@pku.edu.cn，署名单位均为北京大学数学科学学院。
  2026 HUST 会议参会人员 (未做邀请报告)。
