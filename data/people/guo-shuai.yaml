personal_notes: |
  代表作：与 Chang, Li 合作证明 quintic 3-fold 的多项式结构 (Annals of Mathematics 2021)。
  证明 KKV conjecture (与周坚, Adv. Math. 2015)。求是杰出青年学者奖。
  2026 HUST 会议报告: higher-genus GW Theory of O(p-1)⊕O(-p-1)。
  周坚学生圈在北大的关键承接者之一；季策由其指导后进入清华水木学者阶段，使 PKU/BICMR 与清华张友金、周坚方向继续连通。
