personal_notes: |
  2016年6月获中山大学理学博士，同年7月入职郑州大学数学与统计学院。
  2019年9月起在国家留学基金委资助下赴法国索邦大学开展为期一年的博士后研究；
  2024年1月起任郑州大学副教授。官网列研究领域为代数几何、辛几何与数学物理。

  与胡建勋合著的 Refined floor diagrams relative to a conic and Caporaso-Harris type formula
  于2025年首次提交 arXiv，2026年发表于 Journal of the London Mathematical Society。
  论文摘要讨论二次曲线上若干点的平面吹起的相对 Gromov–Witten 不变量与加细 floor diagrams 的对应。

  2026年预印本 arXiv:2602.04191 研究实双 Hurwitz 数的一致渐近。
  作者在摘要中称其对 Dubrovin、Yang、Zagier 提出的 simple Hurwitz 数一致界问题给出了部分回答；
  不能据此称该开放问题已被完整解决。
