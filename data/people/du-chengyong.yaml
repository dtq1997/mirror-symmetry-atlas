personal_notes: '四川师范大学数学科学学院教授，2023年3月起任教授；2021年12月起任博士生导师。此前于2014年7月至2017年12月任讲师，2018年1月至2023年2月任副教授。


  2004–2014年在四川大学先后取得学士、硕士和博士学位。硕士导师为陈柏辉，博士由李安民、陈柏辉联合指导；学位起止年月见履历。


  主要研究辛几何，尤其是辛流形与orbifold的Gromov–Witten理论、微分上同调及辛双有理几何。

  '
