personal_notes: |
  主要研究领域为凸几何、几何分析、黎曼几何与概率。公开署名轨迹从 Memorial / Alberta 的 capacity 与
  convex bodies 工作，延伸到 MSRI 时期的截面问题，再到 HUST 的 Minkowski problem 和 Banach conjecture。
  与 Elisabeth Werner (CWRU)、Deping Ye (Memorial U.) 合作 floating bodies / Ulam floating functions 系列。
  近期做非紧凸集的 Minkowski problem 与 Banach conjecture。
