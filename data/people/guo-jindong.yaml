personal_notes: |
  杨迪的合作者 (推测为博士生 [待验证])，USTC 数学科学学院。
  共同署名 3 篇关于 Witten 交点数 / BGW 数大亏格渐近的论文：
  - 2110.06774 (2021, 与杨迪) — 首篇合作，psi-类交点数大亏格渐近
  - 2412.20388 (2024, 与 Norbury, 杨迪, Zagier) — BGW 数均匀大亏格渐近
  - 2603.15233 (2026, 与杨迪, Zagier) — Witten 交点数均匀大亏格渐近

  2026 HUST 会议上杨迪的报告明确点名郭晋东为矩阵预解方法关键技术合作者。
  代表性贡献：推导 KdV tau 函数的高阶对数导数恒等式，从中导出
  $C(4, \dd) \ge C(0^{12}, \dd)$ 等关键不等式，突破 Aggarwal 的 $n = o(\sqrt{g})$ 限制。
