personal_notes: '中山大学数学学院副教授、博士生导师。河北师大 2025 年 12 月讲座介绍记载其于 2025 年 4 月加入；中山数学学院 2026 年 9 月博导名单列其姓名。

  2020 年学院已有专职科研人员拟聘公示；这一历史记录不能据以确定实际到岗或连续任职。2022 年论文与 2024 年会议记录列 BIMSA 单位，具体任职起止及职级待核实。

  研究涉及函数域、Drinfeld 模、编码理论和奇点理论。博士院校、年份和导师尚未核实；不由论文合作者反推师承。

  2026-10-08 核对本站 15 条论文的 arXiv 原始作者名单；2604.04124 的合作者为 Yixuan Ou-Yang，原先链接到徐旭是错误的。该论文 v2 给出双方中山大学数学学院单位及作者邮箱。

  这次核对覆盖署名和上述履历事实；不保证论文清单完整，也不代表全部出版信息、研究结果或他人身份已核实。

  '
