personal_notes: '2026 HUST 会议报告: From probability theory to Gromov-Witten theory, and back

  Extended matrix models, GW theory of the projective line.

  张庆生的师承关系待独立来源确认；不从合著论文反推博士导师。

  早年与 Mariño、刘秋菊、刘克峰等人的 topological vertex/Mariño-Vafa formula 工作奠定 GW/CS 对偶基础；近年专注 abstract QFT for fat graphs、KP/Toda
  hierarchy 与 emergent geometry。

  '
