personal_notes: '香港中文大学数学系教授。官方教师页列加州大学圣迭戈分校硕士、麻省理工学院博士；MGP记录博士年份为1993，列出Isadore Manuel Singer和Shing-Tung Yau两位导师。更早的入学、MIT与Minnesota任职起止年月仍待一手履历确认。


  研究涉及Calabi–Yau几何、开闭Gromov–Witten不变量、SYZ镜像对称、Witten–Morse理论、量子化、Rozansky–Witten不变量、超Kähler几何与特殊和乐。


  陈国威的本人简历明确列梁乃聪为其2008年博士导师。其他学生与历史任职信息仍按各自来源继续核查。

  '
