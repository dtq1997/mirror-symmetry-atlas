personal_notes: |
  北京大学 BICMR 教授（2023 年起）。2005 年获北大学士学位，2010 年获 Northwestern University 博士学位，导师 Eric Zaslow。
  2010—2014 年任 Columbia Ritt 助理教授，2014 年入职北大；2020 年任副教授，2023 年任教授。
  2017 年春为 IAS 访问成员。办公室：镜春园 78 号院 78407。

  与 Chiu-Chu Melissa Liu、宗正宇长期合作，研究 toric Calabi-Yau 空间的镜像对称、开放 Gromov-Witten 理论及 Remodeling Conjecture。
  与 Liu、Song Yu、宗正宇合著的 Remodeling Conjecture with Descendants（2025）研究半射影 toric Calabi-Yau 三维轨形的等变后裔镜像对称；作者摘要中的等变镜像 Gamma 猜想结论带有指定的整结构和层的支集条件。

  2021 年获国家杰出青年科学基金资助；本人 CV 列出的项目 12125101“镜像对称”执行期为 2022—2026 年。
  2022 年获第十七届中国青年科技奖。NSF DMS-1206667 是其 2012—2015 年主持的科研项目。

  2026 年华中科技大学会议手册列出的报告为 Conic bundle and the mirror hypersurface for a toric Calabi-Yau n-fold，基于与 Yuze Sun、Peng Zhou 的合作。
  本人 CV 记载其于 2024 年春讲授 Mathematical Aspects of String Theory。
