personal_notes: |
  代表作：与田刚合作证明 genus-0 Virasoro conjecture (1998)。
  ICM 2006 invited speaker。Sloan Research Fellowship。
  杨成浪的博士导师。
  研究主线连接 Gromov-Witten 不变量普适方程、Virasoro 猜想、Kontsevich-Witten/BGW tau 函数与 Schur Q-多项式；与王新合作解决 Dubrovin-刘思齐-张友金亏格 2 G-函数猜想，后续又通过杨成浪延伸到 BKP/Q-polynomial 圈。
