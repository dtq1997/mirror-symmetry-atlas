personal_notes: |
  与方博汉、宗正宇长期合作，研究 toric Calabi-Yau 空间的镜像对称与 Remodeling Conjecture。
  Remodeling Conjecture (BKMP) 的主要推动者之一。
  与 Jun Li、Kefeng Liu、Jian Zhou 合作的 topological vertex 数学化论文是开放 GW 理论的奠基性工作之一。
  Columbia 主页还显示她长期组织 Gromov-Witten theory、enumerative geometry 和 symplectic/gauge theory 相关 seminar。
