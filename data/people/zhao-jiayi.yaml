personal_notes: |
  USTC 数学科学学院。2025 年中国科大数学科学学院硕士研究生建议录取名单含赵家艺；
  其 2025 年 arXiv 论文 2510.26137 "GUE Correlators and Large Genus Asymptotics" 单独署名，
  TeX 源署名单位为 School of Mathematical Sciences, University of Science and Technology of China，
  并列出公开邮箱 zhaojiayi616@mail.ustc.edu.cn。
  
  论文使用 Dubrovin-Yang 矩阵预解方法，结合 Guo-Yang 的 psi-类交点数大亏格渐近技术，
  推导具有 1 个 face 的普通图与 ribbon 图的大亏格渐近。论文致谢感谢 Di Yang 提出建议、
  给出问题方向并参与讨论，也感谢 Jindong Guo 的讨论；并说明部分工作在作者 USTC 本科期间完成。
  方向完全对应杨迪近年在 GUE via Frobenius Manifolds 系列、BGW 大亏格渐近方面的工作。
  
  2026 HUST 会议参会者。
  
  现职：中国科学技术大学数学科学学院硕士研究生拟录取 / 在读状态待后续官方页面确认
  学历：USTC 本科经历；2025 年中国科大数学科学学院硕士研究生建议录取
  研究：GUE 关联函数、大亏格渐近、矩阵预解方法 (matrix resolvent method)、可积层级、相交数
  奖项：无
  趣闻：单独署名 arXiv 2510.26137 直接承袭 Dubrovin-Yang 矩阵预解 + 郭晋东-杨迪 ψ-类大亏格渐近技术；TeX 源里留下了公开邮箱和 USTC 署名单位，是后续消歧的重要线索
