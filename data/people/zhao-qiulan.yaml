personal_notes: |
  山东邹平人。山东科技大学数学与系统科学学院副教授、硕士生导师。
  研究方向：孤子理论、可积系统、数学物理。长期与同院李新跃合作 (20+ 篇)，
  研究脉络以离散可积系统、Darboux 变换、Bargmann 约束、代数几何解为主。
  2025 年与北大曲昊男合作发表 2D-Toda 有理约化与广义 Frobenius 流形论文
  (arXiv:2510.04151)，由此与清华张友金-刘思齐 Frobenius 流形/可积层级
  研究组建立直接学术联系，常出现在该组讨论班。
  导师及晋升副教授时间[待补充]，建议从 sdust 学院页面或档案进一步确认。
