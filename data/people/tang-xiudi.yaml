personal_notes: |
  北京理工大学数学与统计学院助理教授。研究方向为微分几何、辛几何、可积系统，
  尤其关注非紧辛流形、奇异 Lagrangian fibration（focus-focus 奇异点）、almost-toric
  和 semitoric 可积系统的分类。

  学术轨迹：2014 清华数学本科 → UCSD 博士（导师 Pelayo, 2018）→ Cornell visiting
  AP（mentor Sjamaar）→ 多伦多博后（mentors Karshon, Gualtieri）→ 北理工 AP。

  代表性工作：与 Karshon 的 symplectic excision (2021)，引入"时间无关不完全
  Hamilton 流"切除辛流形闭子集的方法，构造了 Cantor brush 等反例；与 Pelayo
  的 Vũ Ngọc 多 pinched point focus-focus 奇异纤维猜想验证 (2018)；
  独立工作 "Removing a ray from a noncompact symplectic manifold" (IMRN 2020)。

  2023-05-24 邀请多伦多博后李昱 (Yu Li) 到北理工良乡校区作报告，题目为
  "Integrable systems on the dual of nilpotent Lie subalgebras and T-Poisson
  cluster structures"（与 Yanpeng Li、Jiang-Hua Lu 合作工作），地点：
  良乡校区文萃楼 E808。
