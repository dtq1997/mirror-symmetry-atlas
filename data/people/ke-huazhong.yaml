personal_notes: |
  2026 HUST 会议报告: Gamma conjecture II for del Pezzo surfaces via Gamma-I
  Joint with Jianxun Hu, Changzheng Li and Zhitong Su.
  直接研究 Dubrovin connection 的渐近行为和 Gamma-integral structure，与本项目核心高度相关。
  
  现职：中山大学数学学院
  学历：中山大学学士 (2004-2008) → 清华大学理学博士 (2008-2013, 导师周坚)
  研究：量子上同调的 Gamma 整结构 (NSFC 面上 2023-2026 主持)；参与"镜像对称及相关问题"国家重点研发计划 (胡建勋牵头, 2023-2028)
  教学：线性代数、微分几何、几何与代数、代数拓扑
  现职：中山大学数学学院（[副教授/教授待验证]）
  学历：2004–08 中大数学与应用数学本科 → 2008–13 清华大学数学系博士（导师周坚）
  重要奖项：NSFC 青年项目（"双有理手术下的曲线计数"）；中大青年教师培育项目；2024 在 Acta Math. Sin. 与 Asian J. Math. 各发文一篇关于四维二次曲面爆破的量子上同调
  趣闻：与 Galkin、Iritani、胡建勋、李长征合作 "Revisiting Gamma Conjecture I"（arXiv:2405.16979），给出 Gamma 猜想 I 的反例与修正版本（领域重要进展）；教过文科数学/线代/微分几何
