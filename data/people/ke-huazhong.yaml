personal_notes: |
  2026 HUST 会议报告: Gamma conjecture II for del Pezzo surfaces via Gamma-I
  Joint with Jianxun Hu, Changzheng Li and Zhitong Su.
  直接研究 Dubrovin connection 的渐近行为、Gamma-integral structure 和量子上同调，与本项目核心高度相关。
  与 Galkin、Iritani、胡建勋、李长征、苏治铜合作的 "Revisiting Gamma Conjecture I" 给出 Gamma 猜想 I 的反例与修正版本，是近期重要进展。
