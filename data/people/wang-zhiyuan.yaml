personal_notes: |
  清华本科(2010)+博士(2014-2019) → 北大博后(2019-2023) → HUST 讲师(2023-)。
  2026 数学物理与几何研讨会组织联系人。
  唐乾即将在会议上与他深入交流。
  与周坚、杨成浪、季策、张庆生形成以 tau functions、Kac-Schwarz operators、Hurwitz numbers 和拓扑递归为核心的合作圈。
  论文脉络集中在 "fermionic / Sato Grassmannian / W-约束 → 拓扑递归" 工序，与周坚组的 GW theory、KP/BKP hierarchy 方向连续。
