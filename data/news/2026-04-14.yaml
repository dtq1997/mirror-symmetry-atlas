  summary_zh: 据论文摘要，作者在二维拓扑量子场论的线路复杂度框架下研究紧辛流形的量子上同调。对 Fano 完全交叉和 (co)minuscule 齐性空间，估计在任意小容差下具有有限近似复杂度的态的数量，并给出有限复杂度态所张成子空间的维数上界；对 $\mathrm{Gr}(2,n)$，该上界达到且相关子空间有精确描述。摘要还给出 (co)minuscule 情形下 handle element 除以点类所得算子的特征值正性。2026-09-15 的 v2 修正了记号，作者注明结果不变。
  source_version: 2603.02736v2
