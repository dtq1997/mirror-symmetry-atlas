definition: |
  辛几何中的 $A_\infty$ 范畴，其具体版本取决于辛流形、系数和允许的 Lagrangian 对象。对象需要合适的附加结构与条件，例如分次、spin 结构；更一般的版本还涉及局部系统和消除障碍的数据，不能把任意 Lagrangian 子流形直接当对象。
  在通常的链模型中，态射是 Floer 复形 $CF^*(L_0,L_1)$，$\mu^1$ 是微分，$\mu^2$ 是乘法，较高运算由伪全纯多边形计数给出。取态射上同调后才得到以 $HF^*(L_0,L_1)$ 为态射的上同调范畴。
  导出 Fukaya 范畴还需加入移位、锥等构造；$D^\pi\mathrm{Fuk}$ 进一步包含直和因子闭包。它与凝聚层导出范畴的联系属于指定镜像对的同调镜像对称陈述，不是一般辛流形上无条件的对偶。
history_note: "本条采用 Auroux 综述第 2.3 节及第 3 节的层次区分；最初提出的年代尚待历史来源核对。"
review_note: "2026-10-08：核对链级态射、上同调范畴及导出构造的区别。不同版本所需的解析、障碍与系数条件须查相应构造；本页不是一个覆盖所有辛流形的完整定义。"
