definition: |
  在本条讨论的演化偏微分方程语境中，可积层级是一族彼此相容、流相互交换的演化方程，通常还带有 Hamilton 结构及守恒量等结构。KdV、KP 是具体例子，不是“可积层级”的同义词。
  Frobenius 流形可局部构造相应的主层级（principal hierarchy）：它由一阶拟线性的无色散方程组成，构造需选择归一化的变形平坦坐标。
  Dubrovin–Zhang 层级涉及主层级的拓扑型色散变形，其经典构造以半单 Frobenius 流形为背景。它与无色散主层级须区分；具体的双 Hamilton 递推、tau 结构及变形结论，应按所引文献核对条件。
review_note: "2026-10-08：核对主层级与拓扑型色散变形的区别，以及所列合作论文的研究范围。本条不声称所有 Frobenius 流形都无条件对应同一种 Dubrovin–Zhang 层级；图中学习关系仍待核对。"
