slug: homological-mirror-symmetry
name:
  en: Homological Mirror Symmetry
  zh: 同调镜像对称
aliases:
  - HMS
category: conjecture
difficulty: research-frontier
discipline: math
year_introduced: 1994
introduced_by: [kontsevich]
definition: |
  同调镜像对称把镜像关系表达为范畴之间的等价。在常见的紧致 Calabi–Yau 版本中，对指定镜像对、辛形式及兼容的系数域，预期有
  $$D^b\mathrm{Coh}(X)\simeq D^\pi\mathrm{Fuk}(\check{X}).$$
  左侧是凝聚层的有界导出范畴；右侧是 Fukaya 范畴的导出构造再取直和因子闭包。精确版本常在 dg 或 $A_\infty$ 增强的层面陈述，并可能需要 Novikov 系数、镜像参数变换和 bounding cochain 数据。
  这是猜想框架及已知特定情形的结论，不能对任意两流形直接套用。Fano／Landau–Ginzburg 情形需要相应的范畴版本。
history_note: "Kontsevich 的 1994 年 ICM 稿第 18 页提出 Homological Mirror Conjecture；原文明确称其为尚较粗略的表述，并讨论扩大 Fukaya 范畴的可能性。本页公式使用后续文献常见的记号，不冒充原文逐字表述。"
review_note: "2026-10-08：核对原始提出背景和范畴层次；指定镜像对的系数、参数及构造假设见各论文。已知具体结果和仍需核对的证明基础见问题条目，不能据本页公式认定一般情形已证。"
