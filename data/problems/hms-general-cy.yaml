slug: hms-general-cy
name:
  en: "Homological Mirror Symmetry for general Calabi-Yau manifolds"
  zh: "一般 Calabi-Yau 流形的同调镜像对称"
status: needs-review
importance: major
year_proposed: 1994
proposed_by: [kontsevich]
description: |
  寻找并建立 Calabi–Yau 镜像对之间的同调镜像对称。每个精确问题须指定镜像对象、辛形式、系数域、范畴版本与参数变换；“一般 Calabi–Yau”本身还不是一条条件完全确定的定理陈述。
  下列文献研究具体镜像对。不能由它们概括为“所有 toric、所有 abelian varieties 或所有 Calabi–Yau 均已解决”。
status_note: "本条收录的具体文献已核对；一般框架的最新覆盖范围、历史论文所依赖的范畴构造是否已由后续文献完全补齐，仍待专项复核。"
reviewed_on: "2026-10-08"
review_note: "核对 1994 原文、Seidel 定理 1.3、Sheridan 定理 1.2.7 及依赖说明、Sheridan–Smith 定理 C/D。这里按正文保留系数、参数和范畴构造假设，不把摘要中的概括升级为无条件证明。"
prerequisites: [homological-mirror-symmetry, derived-category]
related_problems: [gamma-conjecture-proof]
key_people: [kontsevich]
progress:
  - date: "1994"
    description: "Kontsevich 在 ICM 稿第 18 页提出 Homological Mirror Conjecture；原文明确保留范畴扩充等细节。"
    papers: ["alg-geom/9411018"]
  - date: "2003（预印本）"
    description: "Seidel 的 quartic surface 工作：定理 1.3 给出指定四次曲面与镜像的三角范畴等价，包括系数域及参数重定；核对版本为 2013 年 v4。"
    papers: ["math/0310414"]
  - date: "2011（预印本）；2015（期刊）"
    description: "Sheridan 研究射影空间中复维数大于 2 的光滑 Calabi–Yau 超曲面。v4 定理 1.2.7 在 Novikov 系数和参数变换下陈述等价；其后明确说明完整 Fukaya 范畴及相关生成结果依赖当时仍在准备中的文献。后续基础补齐情况待核。"
    papers: ["1111.0632"]
  - date: "2017（预印本）；2020（v2）"
    description: "Sheridan–Smith 研究 generalized Greene–Plesser 镜像。第 1.6 节定理 C 的低维版本有 embeddedness 和 MPCS 条件；定理 D 还假设第 2.5 节列出的 Fukaya 范畴性质，不应省略为全部高维情形的无条件定理。"
    papers: ["1709.08937"]
current_approaches:
  - "上述论文使用相对 Fukaya 范畴、变形与生成方法；具体范围和解析前提随镜像对而变。"
notes: "这是一组相关问题的入口，状态待核不意味着所有已知特例均未证明。这里的文献表尚不完整，不能用它判断其他特例是否已有证明。"
sources:
  - label: "Kontsevich：1994 ICM 稿，第 18 页"
    url: "https://arxiv.org/abs/alg-geom/9411018"
  - label: "Seidel：Homological mirror symmetry for the quartic surface，定理 1.3"
    url: "https://arxiv.org/abs/math/0310414v4"
  - label: "Sheridan：定理 1.2.7 及其后的依赖说明"
    url: "https://arxiv.org/abs/1111.0632v4"
  - label: "Sheridan–Smith：第 1.6 节定理 C/D 与第 2.5 节假设"
    url: "https://arxiv.org/abs/1709.08937v2"
