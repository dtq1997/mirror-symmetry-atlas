slug: hms-general-cy
name:
  en: "Homological Mirror Symmetry for general Calabi-Yau manifolds"
  zh: "一般 Calabi-Yau 流形的同调镜像对称"
status: partially-solved
importance: major
year_proposed: 1994
proposed_by: [kontsevich]
description: |
  寻找并建立 Calabi–Yau 镜像对之间的同调镜像对称。每个精确问题须指定镜像对象、辛形式、系数域、范畴版本与参数变换；“一般 Calabi–Yau”本身还不是一条条件完全确定的定理陈述。
  下列文献研究具体镜像对。不能由它们概括为“所有 toric、所有 abelian varieties 或所有 Calabi–Yau 均已解决”。
status_note: "已有多类具体镜像对的结果。2022–2025 年的相对 Fukaya 范畴系列补齐了下列文献中所列的基础依赖，适用范围须保留各自的几何、系数与范畴条件；这不构成任意 Calabi–Yau 的统一结论。"
reviewed_on: "2026-10-08"
review_note: "核对原始文献及 2022–2025 年后续正文：Perutz–Sheridan 的构造、Sheridan 的生成准则、Ganatra–Sheridan 第 2 页的依赖闭合说明、定理 1.12 及注 1.18 脚注 2。这里记录文献结果和字面范围，不声称独立复证全部证明，也不把不同 Fukaya 范畴版本自动等同。"
prerequisites: [homological-mirror-symmetry, derived-category]
related_problems: [gamma-conjecture-proof]
key_people: [kontsevich]
progress:
  - date: "1994"
    description: "Kontsevich 在 ICM 稿第 18 页提出 Homological Mirror Conjecture；原文明确保留范畴扩充等细节。"
    papers: ["alg-geom/9411018"]
  - date: "2003（预印本）"
    description: "Seidel 的 quartic surface 工作：定理 1.3 给出指定四次曲面与镜像的三角范畴等价，包括系数域及参数重定；核对版本为 2013 年 v4。"
    papers: ["math/0310414"]
  - date: "2011（预印本）；2015（期刊）"
    description: "Sheridan 研究射影空间中复维数大于 2 的光滑 Calabi–Yau 超曲面。v4 定理 1.2.7 包含 Novikov 系数及参数变换；原稿列有当时尚待完成的范畴构造依赖。相对 Fukaya 版本的后续基础见下列 2022–2025 年系列，不能把旧稿的待撰引用当作今天仍缺证明的依据。"
    papers: ["1111.0632"]
  - date: "2017（预印本）；2020（v2）"
    description: "Sheridan–Smith 研究 generalized Greene–Plesser 镜像。第 1.6 节定理 C 给出低维结果；定理 D 以第 2.5 节的 Fukaya 范畴性质为基础。后续相对范畴系列补齐其适用范围内的这些依赖，仍须保留 MPCS 与 embeddedness 条件，见 2025 年 Ganatra–Sheridan 注 1.18 脚注 2。"
    papers: ["1709.08937"]
  - date: "2022（预印本）；2023（期刊）"
    description: "Perutz–Sheridan 构造相对 Fukaya 范畴：第 1.2 节要求所选除子锥满足 Ample、Semiample、Semipositive 条件；第 1.4 节在改变系数后加入 bounding cochains。它与其他完整 Fukaya 范畴构造的比较仍是单独的问题，见猜想 1.7。"
    papers: ["2203.15482"]
  - date: "2023（预印本）；2025（期刊）"
    description: "Ganatra、Hanlon、Hicks、Pomerleano、Sheridan 的 arithmetic HMS 定理 C 研究 Greene–Plesser 镜像及相应 Novikov 域，保留底域特征不整除所定义 lcm(λ) 的条件；其相对范畴基础与下列 2025 年系列相接。"
    papers: ["2312.01949"]
  - date: "2024（预印本）"
    description: "同一五位作者研究更广的 Batyrev 镜像。v2 定理 B 要求维数至少 3、指定的特征条件、B 侧扇 Σ* 光滑、MPCS 与 connectedness 条件；先给全忠实嵌入，再通过生成得到等价。它不是所有环面簇中超曲面的无条件结果。"
    papers: ["2406.05272"]
  - date: "2025-11（预印本）"
    description: "Sheridan 构造 big 相对 Fukaya 范畴、开闭映射并证明该框架下的 Abouzaid 生成准则；Ganatra–Sheridan 随后补足配对与循环开闭映射等性质。后一篇第 2 页明确说明，这个系列完成了所列 HMS 结果的相对范畴基础；定理 1.12 给出自动生成准则。该说明不取消原定理的几何条件，也不自动完成与所有其他范畴构造的比较。"
    papers: ["2511.01656", "2511.04498"]
current_approaches:
  - "上述论文使用相对 Fukaya 范畴、变形与生成方法；具体范围和解析前提随镜像对而变。"
notes: "这是一组相关问题的入口。“部分解决”表示收录了有精确范围的具体结果；文献表尚不完整，不能据此判断其他特例是否已有证明。2025 年基础系列目前按所核对的预印本版本收录。"
