slug: gamma-conjecture-proof
name:
  en: "Gamma Conjecture II for general Fano manifolds"
  zh: "一般 Fano 流形的 Gamma 猜想 II"
status: open
importance: major
year_proposed: 2014
proposed_by: []
description: |
  按 Galkin–Golyshev–Iritani 的版本，设 Fano 流形 $X$ 的大量子乘法在某点收敛且半单，并且 $D^b\mathrm{Coh}(X)$ 存在满例外集。对指定容许相位，是否存在合适的满例外集，使其修改后的 Chern 特征乘 Gamma 类给出量子联络的渐近基？具体归一化见 Gamma 猜想概念页和原文猜想 4.6.1。
  这里的目标是满足这些前提的一般 Fano 流形，不是断言所有 Fano 流形都有半单量子上同调。
status_note: "一般版本仍开放；下列已知情形是文献定理的转述。2026 年的新结果覆盖所有 del Pezzo 曲面，不覆盖任意维 Fano 流形。"
reviewed_on: "2026-10-08"
review_note: "核对原始猜想、Grassmannian／quadric／del Pezzo 相关正文和定理陈述。未独立重证这些论文，也未穷尽全部特例；2026 年条目注明预印本版本。"
prerequisites: [gamma-conjecture, quantum-cohomology, derived-category, stokes-phenomenon]
related_problems: [hms-general-cy]
key_people: [cotti, guzzetti, ke-huazhong]
progress:
  - date: "2014（预印本）；2016（期刊）"
    description: "Galkin、Golyshev、Iritani 提出 Gamma I/II；定理 1.3.1–1.3.2 给出复射影空间与普通复 Grassmannian 情形。"
    papers: ["1404.6407"]
  - date: "2018（预印本）；2024（专著）"
    description: "Cotti、Dubrovin、Guzzetti 的 Helix Structures 讨论 Dubrovin 猜想的另一精化；预印本第 5.6 节比较 Gamma II。专著发表于 Springer 的 Lecture Notes in Mathematics 2356。"
    papers: ["1811.09235"]
  - date: "2021（预印本）"
    description: "Xiaowen Hu、Hua-Zhong Ke 的定理 1.1：射影空间中的光滑二次超曲面满足 Gamma II。"
    papers: ["2103.15143"]
  - date: "2026-06-05（预印本）"
    description: "胡建勋、柯华忠、李长征、苏志同：Gamma conjecture II via global Gamma-I，定理 1.4 给出所有 del Pezzo 曲面情形。方法使用满足 (SR) 条件区域上的 Gamma-I 性质、Galois 作用及例外集操作；不是由原版 Gamma I 无条件推出一般 Gamma II。"
    papers: ["2606.07418"]
current_approaches:
  - "2606.07418 的 Strategy-Theorem：须逐一满足收敛、(SR) 区域、谱与例外集条件，不能省去这些前提。"
notes: "原版 Gamma I 已有反例，但那不能直接反驳 Gamma II。del Pezzo 的 Gamma I 论文 1901.01748 与 Gamma II 论文 2606.07418 是不同结果。2026 HUST 会议报告现已有后续预印本可查。"
